<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.8" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.2" cy="0.8" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#f59e0b" stroke-width="0.5" opacity="0.06"/>
    </pattern>
    <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b5563"/>
      <stop offset="0.5" stop-color="#9ca3af"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <rect width="1200" height="900" fill="url(#glow1)"/>
  <rect width="1200" height="900" fill="url(#glow2)"/>

  <!-- Top header bar -->
  <rect x="0" y="0" width="1200" height="78" fill="rgba(11,18,32,0.85)"/>
  <rect x="60" y="22" width="34" height="34" rx="8" fill="#ef4444"/>
  <text x="105" y="48" font-family="Rajdhani, Inter, sans-serif" font-weight="700" font-size="22" fill="#fff">Benders Hub</text>
  <text x="105" y="64" font-family="monospace" font-size="9" fill="#9ca3af" letter-spacing="2">FABRICATION ENGINEERING HUB</text>
  <rect x="980" y="20" width="160" height="40" rx="10" fill="#f59e0b"/>
  <text x="1060" y="46" font-family="Rajdhani" font-weight="600" font-size="15" fill="#111827" text-anchor="middle">Find My Bender</text>

  <!-- Eyebrow chip -->
  <rect x="60" y="160" width="320" height="34" rx="17" fill="rgba(245,158,11,0.08)" stroke="#f59e0b" stroke-opacity="0.3"/>
  <circle cx="80" cy="177" r="4" fill="#f59e0b"/>
  <text x="95" y="182" font-family="monospace" font-size="11" fill="#f59e0b" letter-spacing="2">PREMIUM FABRICATION ENGINEERING HUB</text>

  <!-- Headline -->
  <text x="60" y="260" font-family="Rajdhani, sans-serif" font-weight="700" font-size="60" fill="#fff">Find the Best Tube</text>
  <text x="60" y="320" font-family="Rajdhani, sans-serif" font-weight="700" font-size="60" fill="#fff">Benders &amp; Fabrication</text>
  <text x="60" y="380" font-family="Rajdhani, sans-serif" font-weight="700" font-size="60" fill="#f59e0b">Tools for Precision.</text>

  <!-- Sub -->
  <text x="60" y="430" font-family="Inter, sans-serif" font-size="18" fill="#d1d5db">Build professional fabrication setups for exhausts, roll cages,</text>
  <text x="60" y="456" font-family="Inter, sans-serif" font-size="18" fill="#d1d5db">hydraulic shops, CNC bending, and industrial workflows.</text>

  <!-- CTA buttons -->
  <rect x="60" y="500" width="240" height="56" rx="12" fill="#ef4444"/>
  <text x="180" y="535" font-family="Rajdhani" font-weight="700" font-size="18" fill="#fff" text-anchor="middle">Find My Tube Bender →</text>
  <rect x="320" y="500" width="230" height="56" rx="12" fill="rgba(229,231,235,0.05)" stroke="rgba(229,231,235,0.1)"/>
  <text x="435" y="535" font-family="Rajdhani" font-weight="600" font-size="18" fill="#fff" text-anchor="middle">Open Bend Calculator</text>

  <!-- Side spec console panel -->
  <rect x="780" y="160" width="360" height="500" rx="18" fill="rgba(17,24,39,0.85)" stroke="rgba(229,231,235,0.1)"/>
  <rect x="800" y="180" width="38" height="38" rx="10" fill="url(#tube)"/>
  <text x="850" y="200" font-family="monospace" font-size="10" fill="#9ca3af" letter-spacing="2">LIVE SPEC CONSOLE</text>
  <text x="850" y="218" font-family="Rajdhani" font-weight="700" font-size="18" fill="#fff">Bend preview</text>
  <rect x="1060" y="186" width="60" height="22" rx="4" fill="rgba(16,185,129,0.15)"/>
  <text x="1090" y="201" font-family="monospace" font-size="10" fill="#6ee7b7" text-anchor="middle">OPTIMAL</text>

  <!-- Spec rows -->
  <g font-family="monospace" font-size="11" fill="#9ca3af">
    <rect x="800" y="245" width="155" height="56" rx="8" fill="rgba(11,18,32,0.6)"/>
    <text x="812" y="265">TUBING OD</text>
    <text x="812" y="290" font-size="16" fill="#fff" font-weight="700">1.750"</text>

    <rect x="965" y="245" width="155" height="56" rx="8" fill="rgba(11,18,32,0.6)"/>
    <text x="977" y="265">WALL</text>
    <text x="977" y="290" font-size="16" fill="#fff" font-weight="700">0.095"</text>

    <rect x="800" y="311" width="155" height="56" rx="8" fill="rgba(11,18,32,0.6)"/>
    <text x="812" y="331">CLR</text>
    <text x="812" y="356" font-size="16" fill="#fff" font-weight="700">6.000"</text>

    <rect x="965" y="311" width="155" height="56" rx="8" fill="rgba(11,18,32,0.6)"/>
    <text x="977" y="331">BEND ANGLE</text>
    <text x="977" y="356" font-size="16" fill="#fff" font-weight="700">90°</text>

    <rect x="800" y="377" width="155" height="56" rx="8" fill="rgba(11,18,32,0.6)"/>
    <text x="812" y="397">MATERIAL</text>
    <text x="812" y="422" font-size="13" fill="#fff" font-weight="700">Chromoly 4130</text>

    <rect x="965" y="377" width="155" height="56" rx="8" fill="rgba(11,18,32,0.6)"/>
    <text x="977" y="397">SPRINGBACK</text>
    <text x="977" y="422" font-size="16" fill="#f59e0b" font-weight="700">+1.4°</text>
  </g>

  <!-- Bend visual -->
  <rect x="800" y="450" width="320" height="140" rx="10" fill="rgba(11,18,32,0.6)"/>
  <path d="M 820 560 L 940 560 A 80 80 0 0 1 1020 480 L 1020 460" fill="none" stroke="url(#tube)" stroke-width="20" stroke-linecap="round"/>
  <path d="M 820 560 L 940 560 A 80 80 0 0 1 1020 480 L 1020 460" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>
  <circle cx="940" cy="480" r="4" fill="#f59e0b"/>
  <text x="950" y="488" font-family="monospace" font-size="11" fill="#f59e0b">CLR</text>
  <text x="850" y="548" font-family="monospace" font-size="10" fill="#9ca3af">90°</text>

  <rect x="800" y="605" width="320" height="40" rx="10" fill="#f59e0b"/>
  <text x="960" y="630" font-family="Rajdhani" font-weight="700" font-size="14" fill="#111827" text-anchor="middle">OPEN GEOMETRY VISUALIZER</text>

  <!-- Quick start chips at bottom -->
  <g font-family="Inter" font-size="12" fill="#d1d5db">
    <rect x="60" y="700" width="170" height="44" rx="22" fill="rgba(31,41,55,0.7)" stroke="rgba(229,231,235,0.08)"/>
    <text x="80" y="727">⬡ Beginner Tube Bending</text>
    <rect x="240" y="700" width="170" height="44" rx="22" fill="rgba(31,41,55,0.7)" stroke="rgba(229,231,235,0.08)"/>
    <text x="260" y="727">▲ Exhaust Fabrication</text>
    <rect x="420" y="700" width="170" height="44" rx="22" fill="rgba(31,41,55,0.7)" stroke="rgba(229,231,235,0.08)"/>
    <text x="440" y="727">◆ Roll Cage Setup</text>
    <rect x="600" y="700" width="170" height="44" rx="22" fill="rgba(31,41,55,0.7)" stroke="rgba(229,231,235,0.08)"/>
    <text x="620" y="727">○ CNC Fabrication</text>
  </g>

  <!-- Trust badges -->
  <g font-family="monospace" font-size="10" letter-spacing="1.5">
    <rect x="60" y="780" width="160" height="28" rx="14" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.3)"/>
    <text x="78" y="798" fill="#6ee7b7">✓ REVIEWED BY FABRICATORS</text>
    <rect x="230" y="780" width="130" height="28" rx="14" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.3)"/>
    <text x="248" y="798" fill="#6ee7b7">✓ WORKSHOP TESTED</text>
    <rect x="370" y="780" width="110" height="28" rx="14" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.3)"/>
    <text x="388" y="798" fill="#6ee7b7">✓ UPDATED 2026</text>
  </g>

  <!-- Spark accents -->
  <circle cx="1050" cy="180" r="3" fill="#f59e0b" opacity="0.8"/>
  <circle cx="180" cy="640" r="3" fill="#ef4444" opacity="0.7"/>
  <circle cx="720" cy="660" r="2" fill="#f59e0b" opacity="0.6"/>
</svg>
