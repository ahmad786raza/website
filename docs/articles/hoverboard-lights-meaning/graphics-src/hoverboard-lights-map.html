<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:675px;overflow:hidden}
body{font-family:Inter,Manrope,"DejaVu Sans","Liberation Sans",Arial,sans-serif;background:#f3f6fb;color:#0f172a;position:relative}
.frame{position:absolute;inset:0;padding:44px 56px;background:radial-gradient(900px 500px at 100% 0%,rgba(6,182,212,.14),transparent 60%),radial-gradient(700px 500px at 0% 100%,rgba(29,78,216,.12),transparent 60%),#f3f6fb}
.kicker{display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#1d4ed8}
.kicker::before{content:"";width:26px;height:4px;border-radius:2px;background:linear-gradient(90deg,#1d4ed8,#06b6d4)}
h1{font-size:42px;line-height:1.1;letter-spacing:-.02em;color:#0b1f3a;margin-top:10px;font-weight:800}
.sub{font-size:18px;color:#475569;margin-top:8px;line-height:1.4}
.foot{position:absolute;left:56px;right:56px;bottom:26px;display:flex;justify-content:space-between;font-size:14px;color:#64748b;font-weight:600}
.foot b{color:#0b1f3a}
.cols{display:grid;gap:18px;margin-top:26px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:22px 22px 20px;box-shadow:0 10px 30px rgba(11,31,58,.06);position:relative}
.card h3{font-size:20px;color:#0b1f3a;letter-spacing:-.01em;line-height:1.2}
.card p{font-size:15px;color:#475569;line-height:1.45;margin-top:8px}
.num{position:absolute;top:-15px;left:20px;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#1d4ed8,#06b6d4);color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(29,78,216,.35)}
.led{width:58px;height:58px;border-radius:50%;margin-bottom:14px;position:relative;border:6px solid #fff;box-shadow:0 0 0 2px #e2e8f0}
.led.red{background:#ef4444;box-shadow:0 0 0 2px #fecaca,0 0 26px rgba(239,68,68,.65)}
.led.green{background:#22c55e;box-shadow:0 0 0 2px #bbf7d0,0 0 26px rgba(34,197,94,.6)}
.led.amber{background:#f59e0b;box-shadow:0 0 0 2px #fde68a,0 0 26px rgba(245,158,11,.6)}
.led.blue{background:#3b82f6;box-shadow:0 0 0 2px #bfdbfe,0 0 26px rgba(59,130,246,.6)}
.led.off{background:#cbd5e1;box-shadow:0 0 0 2px #e2e8f0}
.led.blink::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:3px dashed currentColor;opacity:.55}
.led.red.blink{color:#ef4444}.led.green.blink{color:#22c55e}.led.blue.blink{color:#3b82f6}
.led.split{background:linear-gradient(90deg,#ef4444 50%,#22c55e 50%);box-shadow:0 0 0 2px #e2e8f0,0 0 22px rgba(245,158,11,.5)}
.tag{display:inline-block;padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin-top:12px}
.tag.ok{background:#dcfce7;color:#15803d}.tag.warn{background:#fef3c7;color:#b45309}.tag.stop{background:#fee2e2;color:#b91c1c}.tag.info{background:#dbeafe;color:#1d4ed8}
.ico{width:46px;height:46px;border-radius:14px;background:#eef3ff;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.ico svg{width:26px;height:26px;stroke:#1d4ed8;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:38px}</style></head><body><div class="frame">
<div class="kicker">Where the lights are</div>
<h1>The lights on a hoverboard, and which one matters</h1>
<div style="margin-top:4px">
<svg viewBox="0 0 1088 400" width="1088" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Inter,DejaVu Sans,Arial,sans-serif">
 <defs><linearGradient id="deck" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#0b1f3a"/></linearGradient></defs>
 <!-- wheels -->
 <rect x="60" y="130" width="120" height="150" rx="24" fill="#0f172a"/><rect x="908" y="130" width="120" height="150" rx="24" fill="#0f172a"/>
 <rect x="76" y="146" width="88" height="118" rx="18" fill="none" stroke="#38bdf8" stroke-width="6" opacity=".9"/><rect x="924" y="146" width="88" height="118" rx="18" fill="none" stroke="#38bdf8" stroke-width="6" opacity=".9"/>
 <!-- body -->
 <path d="M180 140h300c30 0 50 20 64 60 14-40 34-60 64-60h300c20 0 30 10 30 30v60c0 20-10 30-30 30H608c-30 0-50-20-64-60-14 40-34 60-64 60H180c-20 0-30-10-30-30v-60c0-20 10-30 30-30z" fill="url(#deck)"/>
 <!-- foot pads -->
 <rect x="215" y="165" width="220" height="80" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/><rect x="653" y="165" width="220" height="80" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
 <!-- headlights (front edge) -->
 <rect x="235" y="128" width="90" height="12" rx="6" fill="#f8fafc" stroke="#e0f2fe" stroke-width="3"/><rect x="763" y="128" width="90" height="12" rx="6" fill="#f8fafc" stroke="#e0f2fe" stroke-width="3"/>
 <!-- centre: power button + battery LED + bluetooth LED -->
 <circle cx="544" cy="205" r="22" fill="#0f172a" stroke="#475569" stroke-width="3"/><path d="M544 194v10M536 199a9 9 0 1 0 16 0" fill="none" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
 <circle cx="544" cy="246" r="8" fill="#22c55e"/><circle cx="544" cy="246" r="14" fill="none" stroke="#22c55e" stroke-opacity=".35" stroke-width="4"/>
 <circle cx="520" cy="160" r="6" fill="#3b82f6"/><circle cx="520" cy="160" r="11" fill="none" stroke="#3b82f6" stroke-opacity=".35" stroke-width="4"/>
 <!-- charging port (rear edge) -->
 <rect x="590" y="262" width="34" height="18" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="2"/><circle cx="601" cy="271" r="2.5" fill="#94a3b8"/><circle cx="613" cy="271" r="2.5" fill="#94a3b8"/>
 <!-- labels -->
 <g font-size="17" font-weight="700" fill="#0b1f3a">
  <line x1="280" y1="128" x2="280" y2="78" stroke="#94a3b8" stroke-width="2"/><text x="300" y="66" text-anchor="middle">Front LED headlights</text><text x="300" y="86" text-anchor="middle" font-size="13" font-weight="500" fill="#64748b">white; on while powered</text>
  <line x1="120" y1="130" x2="120" y2="78" stroke="#94a3b8" stroke-width="2"/><text x="100" y="66" text-anchor="middle">Wheel ring LEDs</text><text x="100" y="86" text-anchor="middle" font-size="13" font-weight="500" fill="#64748b">decorative</text>
  <line x1="520" y1="154" x2="520" y2="78" stroke="#94a3b8" stroke-width="2"/><text x="520" y="66" text-anchor="middle">Bluetooth light</text><text x="520" y="86" text-anchor="middle" font-size="13" font-weight="500" fill="#64748b">blue; flashes while pairing</text>
  <line x1="808" y1="128" x2="808" y2="78" stroke="#94a3b8" stroke-width="2"/><text x="808" y="66" text-anchor="middle">Front LED headlights</text>
  <line x1="544" y1="254" x2="470" y2="330" stroke="#94a3b8" stroke-width="2"/><text x="420" y="352" text-anchor="middle">Battery / status indicator</text><text x="420" y="372" text-anchor="middle" font-size="13" font-weight="500" fill="#64748b">green, amber, red or flashing red: the one that matters</text>
  <line x1="607" y1="280" x2="760" y2="330" stroke="#94a3b8" stroke-width="2"/><text x="800" y="352" text-anchor="middle">Charging port</text><text x="800" y="372" text-anchor="middle" font-size="13" font-weight="500" fill="#64748b">the charger brick has its own red/green light</text>
  <line x1="968" y1="130" x2="968" y2="78" stroke="#94a3b8" stroke-width="2"/><text x="968" y="66" text-anchor="middle">Wheel ring LEDs</text>
 </g>
</svg></div>
<div class="foot"><span>Layout varies by model; the indicator usually sits beside the power button. Illustration, not a product photo.</span><b>hoverboardsguide.com</b></div>
</div></body></html>
